name: CI Workflow MLflow Advance

on:
  push:
    paths:
      - MLProject/**
      - .github/workflows/ci.yml
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mlflow-env
          environment-file: MLProject/conda.yaml
          auto-activate-base: false
          auto-update-conda: true
          python-version: "3.10"

      - name: Fix pip and setuptools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==69.5.1 wheel

      - name: Verify Conda Environment
        shell: bash -l {0}
        run: |
          echo "=== Python Version ==="
          python --version
          echo "=== Pip Version ==="
          python -m pip --version
          echo "=== Installed Packages ==="
          python -m pip list

      - name: Check pkg_resources
        shell: bash -l {0}
        run: |
          python -c "import pkg_resources; print('pkg_resources OK')"

      - name: Validate project files
        shell: bash -l {0}
        run: |
          test -f MLProject/modelling.py
          test -f MLProject/conda.yaml
          test -f MLProject/MLproject
          test -f MLProject/dataset_preprocessed/online_shoppers_intention_preprocessed.csv

      - name: Run MLflow Project
        shell: bash -l {0}
        run: |
          cd MLProject
          mlflow run . -P data_path=dataset_preprocessed/online_shoppers_intention_preprocessed.csv --env-manager=local

      - name: Check output files
        shell: bash -l {0}
        run: |
          ls -R MLProject
          test -f MLProject/outputs/best_model.pkl
          test -f MLProject/outputs/best_model_summary.txt

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: best_model
          path: |
            MLProject/outputs/best_model.pkl
            MLProject/outputs/best_model_summary.txt

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/msml_model_image:latest ./MLProject

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/msml_model_image:latest