name: CI Workflow MLflow Advance

on:
  push:
    paths:
      - MLProject/**
      - .github/workflows/ci.yml
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug repository structure
        shell: bash -l {0}
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== .github/workflows ==="
          ls -la .github/workflows || true
          echo "=== MLProject ==="
          ls -la MLProject || true
          echo "=== Recursive files ==="
          find . -maxdepth 3 -type f | sort

      - name: Normalize MLflow project filename
        shell: bash -l {0}
        run: |
          if [ -f "MLProject/MLProject" ] && [ ! -f "MLProject/MLproject" ]; then
            echo "Renaming MLProject/MLProject -> MLProject/MLproject"
            mv MLProject/MLProject MLProject/MLproject
          fi

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mlflow-env
          environment-file: MLProject/conda.yaml
          auto-activate-base: false
          auto-update-conda: true
          python-version: "3.10"

      - name: Fix pip and setuptools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==69.5.1 wheel

      - name: Verify Conda Environment
        shell: bash -l {0}
        run: |
          echo "=== Python Version ==="
          python --version
          echo "=== Pip Version ==="
          python -m pip --version
          echo "=== Installed Packages ==="
          python -m pip list

      - name: Check pkg_resources
        shell: bash -l {0}
        run: |
          python -c "import pkg_resources; print('pkg_resources OK')"

      - name: Validate project files
        shell: bash -l {0}
        run: |
          if [ ! -f "MLProject/modelling.py" ]; then
            echo "ERROR: File MLProject/modelling.py tidak ditemukan"
            exit 1
          fi

          if [ ! -f "MLProject/conda.yaml" ]; then
            echo "ERROR: File MLProject/conda.yaml tidak ditemukan"
            exit 1
          fi

          if [ ! -f "MLProject/MLproject" ]; then
            echo "ERROR: File MLProject/MLproject tidak ditemukan"
            exit 1
          fi

          if [ ! -f "MLProject/requirements.txt" ]; then
            echo "ERROR: File MLProject/requirements.txt tidak ditemukan"
            exit 1
          fi

          if [ ! -f "MLProject/Dockerfile" ]; then
            echo "ERROR: File MLProject/Dockerfile tidak ditemukan"
            exit 1
          fi

          if [ ! -f "MLProject/dataset_preprocessed/online_shoppers_intention_preprocessed.csv" ]; then
            echo "ERROR: Dataset preprocessing tidak ditemukan"
            exit 1
          fi

          echo "Semua file utama ditemukan."

      - name: Run MLflow Project
        shell: bash -l {0}
        run: |
          cd MLProject
          mlflow run . \
            -P data_path=dataset_preprocessed/online_shoppers_intention_preprocessed.csv \
            --env-manager=local

      - name: Check output files
        shell: bash -l {0}
        run: |
          echo "=== MLProject contents after training ==="
          ls -R MLProject
          if [ ! -f "MLProject/outputs/best_model.pkl" ]; then
            echo "ERROR: File output model MLProject/outputs/best_model.pkl tidak ditemukan"
            exit 1
          fi
          echo "Artifact model ditemukan."

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: best_model
          path: MLProject/outputs/best_model.pkl

      - name: DockerHub Login
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker build -t $DOCKERHUB_USERNAME/msml_model_image:latest ./MLProject

      - name: Push Docker Image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker push $DOCKERHUB_USERNAME/msml_model_image:latest